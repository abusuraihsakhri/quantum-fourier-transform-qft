[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-fourier-transform-qft"
version = "2.0.0"
description = "QFT Linear Depth Scalable Quantum Fourier Transform Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1"]
test = ["pytest>=7,<10"]

[project.scripts]
quantum-fourier-transform-qft = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-fourier-transform-qft"
Repository = "https://github.com/abusuraihsakhri/quantum-fourier-transform-qft.git"

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "qft_engine_app"]

[tool.setuptools.packages.find]
include = ["agents*", "qft_engine*"]
